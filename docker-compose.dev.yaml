services:
  app:
    image: 596776566549.dkr.ecr.ap-northeast-2.amazonaws.com/pickleplay/dev:latest
    env_file:
      - .env
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:-pickleplay-596776566549-ap-northeast-2-an}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-dev}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
