name: Dev Build and Deploy

on:
  push:
    branches:
      - develop

run-name: Dev Build and Deploy by @${{ github.actor }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.set-variables.outputs.tag }}
      image_uri: ${{ steps.set-variables.outputs.image_uri }}
    steps:
      - name: Set Variables
        id: set-variables
        run: |
          IMAGE_NAME=596776566549.dkr.ecr.ap-northeast-2.amazonaws.com/pickleplay/dev
          TAG=$(date -u +'%Y%m%d%H%M%S')
          IMAGE_URI=$IMAGE_NAME:$TAG

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo Will push image to ${IMAGE_URI}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ap-northeast-2
          role-to-assume: arn:aws:iam::596776566549:role/BFGithubAction
          output-credentials: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: "${{ steps.set-variables.outputs.image_uri }}"
          build-args: |
            VITE_FRONTEND_FORGE_API_KEY=${{ secrets.VITE_FRONTEND_FORGE_API_KEY }}
            VITE_FRONTEND_FORGE_API_URL=${{ vars.VITE_FRONTEND_FORGE_API_URL }}
            VITE_APP_ENV=development
            VITE_MIXPANEL_TOKEN_DEV=${{ secrets.VITE_MIXPANEL_TOKEN_DEV }}
            VITE_MIXPANEL_TOKEN_PROD=${{ secrets.VITE_MIXPANEL_TOKEN_PROD }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        id: creds
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ap-northeast-2
          role-to-assume: arn:aws:iam::596776566549:role/BFGithubAction
          output-credentials: true

      - name: Update docker-compose
        uses: mikefarah/yq@master
        with:
          cmd: yq '.services.app.image = "${{ needs.build.outputs.image_uri }}"' -i docker-compose.dev.yaml

      - name: Copy docker-compose file
        run: cp docker-compose.dev.yaml docker-compose.yaml

      - name: Generate deployment package
        run: |
          zip -r ${{ needs.build.outputs.tag }}.zip \
            docker-compose.yaml

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ steps.creds.outputs.aws-access-key-id }}
          aws_secret_key: ${{ steps.creds.outputs.aws-secret-access-key }}
          aws_session_token: ${{ steps.creds.outputs.aws-session-token }}
          application_name: ${{ vars.EB_APPLICATION_NAME_DEV || 'pickleplay-dev' }}
          environment_name: ${{ vars.EB_ENVIRONMENT_DEV || 'Pickleplay-dev-env' }}
          version_label: ${{ needs.build.outputs.tag }}
          region: ap-northeast-2
          deployment_package: ${{ needs.build.outputs.tag }}.zip
          wait_for_environment_recovery: 180
