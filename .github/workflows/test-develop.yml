name: Develop Tests

on:
  pull_request:
    branches-ignore:
      - develop
      - main

run-name: Develop Tests by @${{ github.actor }}

jobs:
  bracket-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run bracket logic tests
        run: pnpm exec vitest run server/bracketLogic.test.ts
