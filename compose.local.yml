services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pickleplay
      MYSQL_USER: pickleplay
      MYSQL_PASSWORD: pickleplay
      MYSQL_ROOT_PASSWORD: pickleplay-root
    ports:
      - "3307:3306"
    volumes:
      - pickleplay-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -upickleplay -ppickleplay"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_APP_ID: ${VITE_APP_ID:-}
        VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL:-}
        VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY:-}
        VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT:-}
        VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID:-}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://pickleplay:pickleplay@mysql:3306/pickleplay
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  pickleplay-mysql-data:
